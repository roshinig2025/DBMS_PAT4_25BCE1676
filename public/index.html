<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased">

  <!-- AUTHENTICATION SCREEN -->
  <div id="authContainer" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/10 text-blue-500 mb-4 border border-blue-500/20">
          <i class="fa-solid fa-shield-halved text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">CMS Portal</h1>
        <p class="text-slate-400 text-xs mt-1">Complaint Management System</p>
      </div>

      <!-- Quick Fill Bar -->
      <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 mb-6 flex gap-2">
        <button onclick="quickFill('user')" class="flex-1 py-1.5 bg-slate-800 text-slate-300 text-xs rounded-lg font-medium hover:bg-slate-700 transition">Demo User</button>
        <button onclick="quickFill('admin')" class="flex-1 py-1.5 bg-slate-800 text-slate-300 text-xs rounded-lg font-medium hover:bg-slate-700 transition">Demo Admin</button>
      </div>

      <form onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
          <input type="email" id="authEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
          <input type="password" id="authPassword" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-xl transition shadow-lg shadow-blue-600/20">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP WRAPPER -->
  <div id="appWrapper" class="hidden flex-1 flex flex-col md:flex-row h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <aside class="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 p-4">
      <div>
        <div class="p-4 border-b border-slate-800 flex items-center gap-3 mb-4">
          <i class="fa-solid fa-shield-halved text-2xl text-blue-500"></i>
          <div>
            <h2 class="font-bold text-white text-sm">CMS Portal</h2>
            <p class="text-[10px] text-slate-400" id="userRoleBadge">USER ROLE</p>
          </div>
        </div>

        <nav class="space-y-1">
          <button onclick="switchView('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 transition">
            <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
          </button>
          <button onclick="switchView('complaints')" id="nav-complaints" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 transition">
            <i class="fa-solid fa-list-check w-5"></i> Complaints
          </button>
        </nav>
      </div>

      <button onclick="logout()" class="w-full py-2 bg-slate-800 hover:bg-red-500/10 hover:text-red-400 text-slate-400 text-xs font-medium rounded-xl transition">
        <i class="fa-solid fa-right-from-bracket mr-2"></i> Sign Out
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 bg-slate-950 flex flex-col overflow-y-auto p-6">
      <header class="pb-6 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold text-white" id="pageTitle">Dashboard</h1>
          <p class="text-xs text-slate-400">Overview & Management Portal</p>
        </div>
        <button id="fileBtn" onclick="openModal()" class="py-2 px-4 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> File Complaint
        </button>
      </header>

      <!-- VIEW: DASHBOARD -->
      <div id="view-dashboard" class="pt-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
            <p class="text-xs font-semibold text-slate-400 mb-1">Total Complaints</p>
            <p class="text-2xl font-bold text-white" id="statTotal">0</p>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
            <p class="text-xs font-semibold text-slate-400 mb-1">Pending</p>
            <p class="text-2xl font-bold text-amber-400" id="statPending">0</p>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
            <p class="text-xs font-semibold text-slate-400 mb-1">In Progress</p>
            <p class="text-2xl font-bold text-blue-400" id="statInProgress">0</p>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
            <p class="text-xs font-semibold text-slate-400 mb-1">Resolved</p>
            <p class="text-2xl font-bold text-emerald-400" id="statResolved">0</p>
          </div>
        </div>
      </div>

      <!-- VIEW: COMPLAINTS TABLE -->
      <div id="view-complaints" class="pt-6 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-800">
                <tr>
                  <th class="p-4">ID</th>
                  <th class="p-4">Title</th>
                  <th class="p-4">Category</th>
                  <th class="p-4">Priority</th>
                  <th class="p-4">Status</th>
                  <th class="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="complaintsTbody" class="divide-y divide-slate-800 text-slate-300">
                <!-- Rows injected dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- FILE COMPLAINT MODAL -->
  <div id="complaintModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-white">File New Complaint</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form onsubmit="handleCreate(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Title</label>
          <input type="text" id="mTitle" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
            <select id="mCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
              <option value="IT Support">IT Support</option>
              <option value="Facilities">Facilities</option>
              <option value="Hardware">Hardware</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Priority</label>
            <select id="mPriority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Description</label>
          <textarea id="mDesc" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>
        <div class="flex gap-2 justify-end pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT SECTION -->
  <script>
    let currentUser = null;

    function quickFill(role) {
      document.getElementById('authEmail').value = role === 'admin' ? 'admin@system.com' : 'user@system.com';
      document.getElementById('authPassword').value = 'pass123';
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const role = email.includes('admin') ? 'admin' : 'user';
      currentUser = { email, role, name: role === 'admin' ? 'System Admin' : 'Demo User' };

      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('appWrapper').classList.remove('hidden');
      document.getElementById('userRoleBadge').innerText = role.toUpperCase() + ' ROLE';
      
      if (role === 'admin') {
        document.getElementById('fileBtn').classList.add('hidden');
      } else {
        document.getElementById('fileBtn').classList.remove('hidden');
      }

      switchView('dashboard');
    }

    function logout() {
      currentUser = null;
      document.getElementById('authContainer').classList.remove('hidden');
      document.getElementById('appWrapper').classList.add('hidden');
    }

    function switchView(view) {
      document.getElementById('view-dashboard').classList.toggle('hidden', view !== 'dashboard');
      document.getElementById('view-complaints').classList.toggle('hidden', view !== 'complaints');
      document.getElementById('pageTitle').innerText = view === 'dashboard' ? 'Dashboard Overview' : 'Complaint Records';

      fetchComplaints();
    }

    function openModal() { document.getElementById('complaintModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('complaintModal').classList.add('hidden'); }

    // API CALLS
    async function fetchComplaints() {
      try {
        const res = await fetch('/api/complaints');
        const data = await res.json();
        
        document.getElementById('statTotal').innerText = data.length || 0;
        document.getElementById('statPending').innerText = data.filter(c => c.status === 'Pending').length || 0;
        document.getElementById('statInProgress').innerText = data.filter(c => c.status === 'In Progress').length || 0;
        document.getElementById('statResolved').innerText = data.filter(c => c.status === 'Resolved').length || 0;

        const tbody = document.getElementById('complaintsTbody');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">No complaints found in database.</td></tr>`;
          return;
        }

        data.forEach(c => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-800/30 transition';
          tr.innerHTML = `
            <td class="p-4 font-mono text-slate-400">${c.complaint_id}</td>
            <td class="p-4 font-medium text-white">${c.title}</td>
            <td class="p-4">${c.category}</td>
            <td class="p-4">${c.priority}</td>
            <td class="p-4"><span class="px-2 py-1 rounded text-[10px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">${c.status}</span></td>
            <td class="p-4 text-right">
              ${currentUser && currentUser.role === 'admin' ? `
                <select onchange="updateStatus('${c.complaint_id}', this.value)" class="bg-slate-950 border border-slate-800 rounded p-1 text-[10px] text-white">
                  <option value="Pending" ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
                  <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                  <option value="Resolved" ${c.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                </select>
                <button onclick="deleteComplaint('${c.complaint_id}')" class="ml-2 text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
              ` : '<span class="text-slate-500">View Only</span>'}
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Error fetching complaints:", err);
      }
    }

    async function handleCreate(e) {
      e.preventDefault();
      await fetch('/api/complaints', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('mTitle').value,
          category: document.getElementById('mCategory').value,
          priority: document.getElementById('mPriority').value,
          description: document.getElementById('mDesc').value,
          userEmail: currentUser.email,
          userName: currentUser.name
        })
      });
      closeModal();
      fetchComplaints();
    }

    async function updateStatus(id, status) {
      await fetch(`/api/complaints/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      fetchComplaints();
    }

    async function deleteComplaint(id) {
      await fetch(`/api/complaints/${id}`, { method: 'DELETE' });
      fetchComplaints();
    }
  </script>
</body>
</html>
